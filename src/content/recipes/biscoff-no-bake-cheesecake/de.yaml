locale: de
slug: biscoff-no-bake-cheesecake
title: Biscoff No-Bake Cheesecake
description: Cremiger Käsekuchen ohne Backen mit Keksboden und Biscoff-Creme.
imageAlt:
  cover.webp: Platzhalterbild für den Biscoff No-Bake Cheesecake
ingredientGroups:
  crust: Boden
  filling: Creme
ingredientNotes:
  butter: geschmolzen
steps:
  crumble-biscuits: Alle Kekse bis auf 1–2 fein zerkrümeln und mit der geschmolzenen Butter vermischen. Die übrigen Kekse für die Deko beiseitelegen.
  press-crust: Die Keks-Butter-Mischung als Boden in eine Springform geben, gleichmäßig andrücken und etwa 15–30 Minuten im Kühlschrank fest werden lassen.
  mix-filling: Mascarpone, Quark und etwa ¾ der Biscoff-Creme glatt rühren. Den Rest als Topping beiseitestellen.
  whip-cream: Sahne steif schlagen und unterheben.
  assemble-and-chill: Creme auf den Boden geben und mindestens 4 Stunden kühlen, bis sie fest ist.
  top-with-spread: Die restliche Biscoff-Creme im Wasserbad oder in der Mikrowelle leicht erwärmen, damit sie sich leichter verteilen lässt, und gleichmäßig auf der festen Creme verstreichen.
  decorate: Die übrigen Kekse zerbröseln und gleichmäßig auf dem Kuchen verteilen.
