locale: en
slug: biscoff-no-bake-cheesecake
title: Biscoff No-Bake Cheesecake
description: Creamy no-bake cheesecake with a biscuit base and Biscoff spread.
imageAlt:
  cover.webp: Placeholder image for the Biscoff no-bake cheesecake
ingredientGroups:
  crust: Base
  filling: Filling
ingredientNotes:
  butter: melted
steps:
  crumble-biscuits: Finely crush all but 1–2 of the biscuits and mix them with the melted butter. Set the remaining biscuits aside for decorating.
  press-crust: Spread the biscuit-butter mixture over the bottom of a springform tin, press it down evenly and chill for about 15–30 minutes until firm.
  mix-filling: Beat the mascarpone, quark and about ¾ of the Biscoff spread until smooth. Keep the rest for the topping.
  whip-cream: Whip the cream until stiff and fold it in.
  assemble-and-chill: Spread the filling over the base and chill for at least 4 hours until set.
  top-with-spread: Gently warm the remaining Biscoff spread in a water bath or the microwave so it spreads more easily, then spread it evenly over the set filling.
  decorate: Crumble the remaining biscuits and scatter them evenly over the cake.
