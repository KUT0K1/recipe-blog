locale: de
slug: cremiger-kartoffel-hack-auflauf
title: Cremiger Kartoffel-Hack-Auflauf mit Speck
description: Deftiger Auflauf aus Kartoffelscheiben, Hackfleisch und Speck in Knoblauch-Sahne-Sauce, mit Käse überbacken.
imageAlt:
  cover.webp: Platzhalterbild für den Kartoffel-Hack-Auflauf
ingredientGroups:
  base: Kartoffeln und Hackfüllung
  sauce: Sauce
  topping: Zum Überbacken
ingredientNotes:
  frozen-vegetables: optional, z. B. Blumenkohl und Möhren
  tomato-paste: optional
  paprika: optional
  marjoram: nach Geschmack, alternativ Thymian
steps:
  par-boil-potatoes: Kartoffeln schälen, in dünne Scheiben schneiden und 5–7 Minuten in Salzwasser vorkochen. Sie sollen noch deutlich Biss haben.
  brown-filling: Speck in einer Pfanne auslassen, Zwiebel dazugeben und kurz anbraten. Dann das Hackfleisch kräftig anbraten und zum Schluss den Knoblauch dazugeben. Mit Pfeffer, Paprikapulver und etwas Majoran oder Thymian würzen. Wer TK-Gemüse verwendet, brät es jetzt gefroren 3–4 Minuten mit.
  mix-sauce: Sahne, Milch und Brühe verrühren und kräftig mit Pfeffer und Muskat würzen. Optional vorher 1 TL Tomatenmark in der Hackpfanne kurz anrösten – das macht den Auflauf kräftiger, ohne nach Tomatensauce zu schmecken.
  layer-and-bake: In eine kleine Auflaufform erst Kartoffeln, dann die Hackfüllung und wieder Kartoffeln schichten. Die Sauce darübergießen, den Käse daraufstreuen und bei 200 °C Ober-/Unterhitze 20–25 Minuten backen, bis der Käse schön gebräunt ist.
notes:
  - Mit Salz sparsam sein – Speck, Brühe und Käse bringen schon Salz mit.
  - Die Sauce kann auch kurz zum Hack gegeben statt über den Auflauf gegossen werden.
