locale: de
slug: schmand-kuchen
title: Schmand-Kuchen
description: Saftiger Rührkuchen mit Haselnüssen und Schokostreuseln – abgemessen mit dem Schmandbecher.
imageAlt:
  cover.webp: Platzhalterbild für den Schmand-Kuchen
ingredientNotes:
  sour-cream: 1 Becher – den leeren Becher als Maß für die übrigen Zutaten verwenden
  flour: ca. 130 g; für Muffins je nach Konsistenz ½–2 Becher
  sugar: kann auch reduziert werden
  ground-hazelnuts: ca. 100 g, alternativ gemahlene Mandeln
  chocolate-sprinkles: ca. 100 g
  cocoa-powder: optional, damit er noch schokoladiger wird
steps:
  mix: Alle Zutaten miteinander vermischen.
  bake: Den Teig in eine eingefettete Kastenform geben und bei 160 °C Umluft ca. 60 Minuten backen.
