locale: en
slug: sour-cream-cake
title: Sour Cream Cake
description: Moist loaf cake with hazelnuts and chocolate sprinkles – measured with the sour cream tub.
imageAlt:
  cover.webp: Placeholder image for the sour cream cake
ingredientNotes:
  sour-cream: 1 tub (German "Schmand") – use the empty tub to measure the other ingredients
  flour: about 130 g; for muffins ½–2 cups depending on consistency
  sugar: can be reduced
  ground-hazelnuts: about 100 g, or ground almonds
  chocolate-sprinkles: about 100 g
  cocoa-powder: optional, for an even more chocolatey cake
steps:
  mix: Mix all the ingredients together.
  bake: Pour the batter into a greased loaf tin and bake at 160 °C (fan) for about 60 minutes.
